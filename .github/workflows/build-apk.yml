name: Build Little Memories APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      # The repository contains the Dart app files but not the generated
      # Android host project. Flutter can generate that host project in CI.
      - name: Generate Android project
        run: flutter create --platforms=android --project-name=little_memories .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: little-memories-apk
          path: build/app/outputs/flutter-apk/app-release.apk
