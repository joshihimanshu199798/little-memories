name: Build Little Memories APK v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Save app pubspec
        run: cp pubspec.yaml /tmp/little-memories-pubspec.yaml
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name=little_memories .
      - name: Restore app pubspec
        run: cp /tmp/little-memories-pubspec.yaml pubspec.yaml
      - name: Use verified source
        run: cp lib/main_fixed.dart lib/main.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: little-memories-apk-v2
          path: build/app/outputs/flutter-apk/app-release.apk
