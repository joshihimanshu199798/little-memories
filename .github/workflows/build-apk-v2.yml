name: Build Little Memories APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=little_memories .

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Configure Android photo permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = """    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>"""
          s = s.replace('<application', perms + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Verify latest app source
        run: |
          test -s lib/main.dart
          echo "Building latest lib/main.dart"
          wc -l lib/main.dart
          sha256sum lib/main.dart

      - name: Analyze Dart source
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload single APK
        uses: actions/upload-artifact@v4
        with:
          name: little-memories-latest-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
