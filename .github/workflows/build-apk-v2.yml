name: Build Little Memories APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: little-memories-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Analyze and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=little_memories .

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Configure Android photo permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = """    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>"""
          s = s.replace('<application', perms + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Verify latest app source
        run: |
          test -s lib/main.dart
          echo "Building latest lib/main.dart"
          wc -l lib/main.dart
          sha256sum lib/main.dart

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Validate APK package
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "^package: name=" /tmp/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Build smaller device-specific APKs
        run: flutter build apk --release --split-per-abi

      - name: Validate ARM64 APK
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: little-memories-apks-run-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Little Memories — Latest APK
          target_commitish: ${{ github.sha }}
          body: |
            Automatically generated Android APK for Little Memories.

            - Workflow run: #${{ github.run_number }}
            - Source commit: ${{ github.sha }}
            - Trigger: ${{ github.event_name }}
            - Built with Flutter 3.41.2
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          overwrite_files: true
          make_latest: true
