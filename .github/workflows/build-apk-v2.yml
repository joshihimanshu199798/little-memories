name: Build Little Memories APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: little-memories-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Analyze and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=little_memories .

      - name: Configure Android photo permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = """    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>"""
          s = s.replace('<application', perms + '\\n    <application', 1)
          p.write_text(s)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify source commit
        run: |
          test -s lib/main.dart
          test -s pubspec.yaml
          echo "Source commit: ${GITHUB_SHA}"
          sha256sum lib/main.dart pubspec.yaml

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run automated tests
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test --reporter expanded
          else
            echo "::error::No Dart tests found. Add meaningful tests before this build can be considered release-ready."
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK artifact
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-memories-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified main-branch APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download APK artifact from this run
        uses: actions/download-artifact@v4
        with:
          name: little-memories-apk-${{ github.sha }}
          path: dist

      - name: Verify downloaded APK
        run: |
          test -s dist/app-release.apk
          sha256sum dist/app-release.apk

      - name: Publish latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Little Memories — Latest APK
          target_commitish: ${{ github.sha }}
          body: |
            Automatically generated Android APK for Little Memories.

            - Workflow run: #${{ github.run_number }}
            - Source commit: ${{ github.sha }}
            - Trigger: ${{ github.event_name }}
            - Built with Flutter 3.41.2
          files: dist/app-release.apk
          overwrite_files: true
          make_latest: true
