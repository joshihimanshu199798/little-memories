name: Build Little Memories APK v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Save app pubspec
        run: cp pubspec.yaml /tmp/little-memories-pubspec.yaml
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name=little_memories .
      - name: Configure Android photo permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = """    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>"""
          s = s.replace('<application', perms + '\n    <application', 1)
          p.write_text(s)
          PY
      - name: Restore app pubspec
        run: cp /tmp/little-memories-pubspec.yaml pubspec.yaml
      - name: Use verified source
        run: cp lib/main_fixed.dart lib/main.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: little-memories-apk-v2
          path: build/app/outputs/flutter-apk/app-release.apk
