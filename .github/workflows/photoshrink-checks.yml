name: PhotoShrink Restore validation

on:
  push:
    branches:
      - feature/photo-shrink-restore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photoshrink-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Generate Android platform files if absent
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --project-name=little_memories .
          fi

      - name: Declare Android media permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest'
          insert = '''  <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'''
          if "android.permission.READ_MEDIA_IMAGES" not in s:
              s = s.replace('    <application', insert + '\n    <application', 1)
          p.write_text(s)
          print("Android media permissions declared")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: photoshrink-restore-validation-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
