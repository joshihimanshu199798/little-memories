name: little_memories
description: Little Memories - a private family photo timeline and collaboration app.
publish_to: "none"
version: 2.1.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.12.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  share_plus: ^10.1.4
  image_editor_plus: ^1.0.8
  shelf: ^1.4.2
  qr_flutter: ^4.1.0
  cross_file: ^0.3.5+5
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
